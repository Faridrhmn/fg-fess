<header class="site-header">
  <div class="admin-header-container header-inner">
    <div class="logo">
      <a href="/" style="text-decoration: none; color: inherit; display: inline-flex; align-items: center;">
        <span class="logo-mark">fg</span><span class="logo-sep">/</span><span class="logo-word">fess</span>
      </a>
      {% if current_user.is_authenticated and current_user.is_superadmin %}
        <span class="admin-badge">admin</span>
      {% else %}
        <span class="admin-badge" style="background: var(--primary);">moderator</span>
      {% endif %}
    </div>
    <div class="header-actions">
      {% if current_user.is_authenticated and current_user.is_superadmin %}
        <a href="/admin" class="btn-outline-sm {% if request.path == '/admin' %}active{% endif %}">Messages</a>
        <a href="/admin/feedback" class="btn-outline-sm {% if request.path.startswith('/admin/feedback') %}active{% endif %}">Feedback</a>
      {% endif %}
      <a href="/my-rooms" class="btn-outline-sm {% if request.path.startswith('/my-rooms') %}active{% endif %}">My Rooms</a>
      <a href="/" class="btn-outline-sm" target="_blank">Lihat Board</a>
      <a href="/logout" class="btn-outline-sm btn-danger-outline">Logout</a>
      <button id="darkModeToggle" title="Toggle dark mode" aria-label="Toggle dark mode" onclick="toggleDarkMode()">
        <svg id="darkModeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </div>
</header>
