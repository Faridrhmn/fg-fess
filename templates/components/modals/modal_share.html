<!-- Share Card Modal -->
<div id="shareModal" class="share-modal-backdrop" style="display: none;" onclick="handleShareBackdropClick(event)">
  <div class="share-modal-container" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
    <div class="share-modal-header">
      <div class="share-modal-title" id="shareModalTitle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
        <span>Bagikan ke Medsos</span>
      </div>
      <button type="button" class="share-modal-close" onclick="closeShareModal()" title="Tutup">&times;</button>
    </div>

    <div class="share-modal-body">
      <div class="share-controls">
        <div class="share-control-group">
          <label class="share-control-label">Ukuran:</label>
          <div class="share-btn-group">
            <button type="button" class="share-option-btn active" id="btnRatioStory" onclick="setShareRatio('story')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/></svg>
              Story 9:16
            </button>
            <button type="button" class="share-option-btn" id="btnRatioSquare" onclick="setShareRatio('square')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
              Post 1:1
            </button>
          </div>
        </div>

        <div class="share-control-group">
          <label class="share-control-label">Tema:</label>
          <div class="share-theme-selector">
            <button type="button" class="theme-dot active theme-dot-emerald" id="dot-emerald" onclick="setShareTheme('emerald')" title="Emerald Neon"></button>
            <button type="button" class="theme-dot theme-dot-midnight" id="dot-midnight" onclick="setShareTheme('midnight')" title="Midnight OLED"></button>
            <button type="button" class="theme-dot theme-dot-sunset" id="dot-sunset" onclick="setShareTheme('sunset')" title="Sunset Warm"></button>
            <button type="button" class="theme-dot theme-dot-clean" id="dot-clean" onclick="setShareTheme('clean')" title="Clean Minimal"></button>
          </div>
        </div>
      </div>

      <div class="share-preview-wrapper" id="sharePreviewWrapper">
        <div id="shareCardTarget" class="share-card-canvas theme-emerald ratio-story">
          <div class="share-card-inner">
            <div class="share-card-top">
              <div class="share-brand-badge">
                <span class="share-brand-logo">fg/fess</span>
                <span class="share-brand-sub">Pesan Anonim</span>
              </div>
              <div class="share-card-badge-id" id="shareCardMsgId">#0</div>
            </div>

            <div class="share-card-content">
              <div class="share-card-text" id="shareCardText"></div>
              <div class="share-card-image" id="shareCardImage" style="display: none;"></div>
              <div class="share-card-poll" id="shareCardPoll" style="display: none;"></div>
            </div>

            <div class="share-card-footer">
              <div class="share-card-meta">
                <span class="share-card-time" id="shareCardTime">12:00 WIB</span>
                <span class="share-card-bullet">·</span>
                <span class="share-card-loc" id="shareCardLoc">Anonim</span>
              </div>
              <div class="share-card-watermark">fg/fess · pesan tanpa jejak</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="share-modal-footer">
      <button type="button" class="btn-share-action btn-share-download" id="btnDownloadCard" onclick="downloadShareCard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span id="btnDownloadText">Unduh PNG</span>
      </button>
      <button type="button" class="btn-share-action btn-share-native" id="btnNativeShare" onclick="shareToMedsos()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
        <span>Bagikan</span>
      </button>
      <button type="button" class="btn-share-action btn-share-copy" onclick="copyMessageLink()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span>Salin Link</span>
      </button>
    </div>
  </div>
</div>
