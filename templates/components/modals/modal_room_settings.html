<!-- Modal Pengaturan Room (Khusus Moderator Room) -->
<div id="roomSettingsModal" class="room-modal-overlay hidden" onclick="if(event.target === this) closeRoomSettingsModal()">
  <div class="room-modal-card">
    <div class="room-modal-head">
      <h3 class="room-modal-title">⚙️ Pengaturan: {{ current_room.name }}</h3>
      <button type="button" class="room-modal-close" onclick="closeRoomSettingsModal()">&times;</button>
    </div>
    <form onsubmit="handleSaveRoomSettings(event)">
      <div id="roomSettingsError" class="alert alert-danger" style="display: none; margin-bottom: 14px;"></div>
      <div id="roomSettingsSuccess" class="alert alert-success" style="display: none; margin-bottom: 14px;"></div>

      <div class="form-group" style="margin-bottom: 12px; text-align: left;">
        <label class="form-label" style="font-weight: 600; font-size: 0.85rem;">Nama Room</label>
        <input type="text" id="rs_name" class="form-input" value="{{ current_room.name }}" required />
      </div>

      <div class="form-group" style="margin-bottom: 14px; text-align: left;">
        <label class="form-label" style="font-weight: 600; font-size: 0.85rem;">Deskripsi Room</label>
        <textarea id="rs_desc" class="form-input" rows="3">{{ current_room.description or '' }}</textarea>
      </div>

      {% if current_room.is_private %}
      <div class="form-group" style="margin-bottom: 16px; background: var(--bg); padding: 12px; border-radius: 8px; text-align: left;">
        <label class="form-label" style="font-weight: 600; font-size: 0.85rem;">Ganti Visitor Passcode (Opsional)</label>
        <input type="password" id="rs_passcode" class="form-input" placeholder="Biarkan kosong jika tidak ingin ganti" />
      </div>
      {% endif %}

      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button type="button" class="btn-room-action" onclick="closeRoomSettingsModal()">Tutup</button>
        <button type="submit" class="btn-room-action btn-room-primary">Simpan Perubahan</button>
      </div>
    </form>
  </div>
</div>
