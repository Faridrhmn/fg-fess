<!-- Compose Box Component -->
<section class="compose-card" id="compose">
  <div class="compose-header">
    <span class="compose-label">Kirim pesan anonim</span>
    <div class="compose-header-right">
      <div class="format-toolbar" aria-label="Format teks">
        <button type="button" class="format-btn" onclick="applyFormat('bold')" title="Tebal (*teks* atau Ctrl+B)"><strong>B</strong></button>
        <button type="button" class="format-btn" onclick="applyFormat('italic')" title="Miring (_teks_ atau Ctrl+I)"><em>I</em></button>
        <button type="button" class="format-btn" onclick="applyFormat('underline')" title="Garis Bawah (__teks__ atau Ctrl+U)"><u>U</u></button>
        <button type="button" class="format-btn" onclick="applyFormat('strike')" title="Coret (~teks~)"><s>S</s></button>
        <button type="button" class="format-btn format-btn-spoiler" onclick="applyFormat('spoiler')" title="Sensor / Spoiler (||teks||)">🙈</button>
      </div>
      <span class="char-counter" id="charCounter">0 / 500</span>
    </div>
  </div>
  <textarea id="messageInput" class="compose-textarea"
    placeholder="Tulis apa yang ingin kamu sampaikan… tidak ada nama, tidak ada jejak. Gunakan #hashtag untuk topik!" maxlength="500"
    rows="4"></textarea>
  <div id="imagePreviewContainer" style="display: none; margin-top: 8px; position: relative; max-width: max-content;">
    <img id="imagePreview" src="" style="max-height: 150px; border-radius: 8px; border: 1px solid var(--border);">
    <button onclick="removeImage()" style="position: absolute; top: -8px; right: -8px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px;" title="Hapus Gambar">&times;</button>
  </div>

  <!-- Poll Creator Section -->
  <div id="pollCreatorSection" class="poll-creator" style="display: none;">
    <div class="poll-creator-header">
      <div class="poll-creator-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <rect x="3" y="4" width="18" height="3" rx="1.5"/>
          <rect x="3" y="10" width="13" height="3" rx="1.5"/>
          <rect x="3" y="16" width="8" height="3" rx="1.5"/>
        </svg>
        <span>Polling Anonim</span>
      </div>
      <button type="button" class="poll-creator-close" onclick="cancelPoll()" title="Batalkan Polling">&times;</button>
    </div>
    <div class="poll-options-list" id="pollOptionsList">
      <div class="poll-option-row">
        <input type="text" class="poll-option-input" placeholder="Pilihan 1" maxlength="80">
      </div>
      <div class="poll-option-row">
        <input type="text" class="poll-option-input" placeholder="Pilihan 2" maxlength="80">
      </div>
    </div>
    <div class="poll-creator-actions">
      <button type="button" class="btn-add-option" id="btnAddPollOption" onclick="addPollOption()">+ Tambah Pilihan</button>
      <div class="poll-duration-wrapper">
        <label for="pollDurationSelect" class="poll-duration-label">Batas:</label>
        <div class="poll-select-custom">
          <select id="pollDurationSelect" class="poll-duration-select">
            <option value="0">Tanpa batas</option>
            <option value="1">1 Hari (24 Jam)</option>
            <option value="3">3 Hari</option>
            <option value="7">7 Hari</option>
          </select>
          <svg class="poll-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
      <span class="poll-hint">Maks. 5 pilihan</span>
    </div>
  </div>

  <div class="compose-footer">
    <p class="compose-note">Pesanmu akan tampil secara publik dan anonim. <kbd>Ctrl+Enter</kbd> untuk kirim.<br>Maks. ukuran gambar: 5MB.</p>
    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
      <button type="button" id="pollToggleBtn" class="btn-outline-sm" onclick="togglePollCreator()" title="Tambah Polling ke pesan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <rect x="3" y="4" width="18" height="3" rx="1.5"/>
          <rect x="3" y="10" width="13" height="3" rx="1.5"/>
          <rect x="3" y="16" width="8" height="3" rx="1.5"/>
        </svg>
        <span id="pollToggleLabel">Polling</span>
      </button>
      <label for="imageInput" class="btn-outline-sm" style="cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 7px 12px; margin: 0;" title="Maksimal ukuran gambar 5MB">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span id="imageLabel">Gambar</span>
      </label>
      <input type="file" id="imageInput" accept="image/png, image/jpeg, image/gif, image/webp" style="display: none;">
      <button id="submitBtn" class="btn-send" onclick="submitMessage()">
        <span class="btn-text">Kirim</span>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
  </div>
  <div id="submitFeedback" class="submit-feedback hidden"></div>
</section>
